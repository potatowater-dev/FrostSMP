<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Payment cancelled — Frost FFA</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="result-page">
    <div class="result-card reveal is-visible">
      <p class="result-eyebrow">Checkout cancelled</p>
      <h1>No charge made</h1>
      <p class="result-body">
        You left Stripe checkout before paying. Your card was not charged.
        You can try again anytime from the store.
      </p>
      <div class="result-actions">
        <a class="btn btn-primary" href="/#store">Back to store</a>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
