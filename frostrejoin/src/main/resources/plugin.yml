name: FrostRejoin
version: '${version}'
main: com.frostsmp.rejoin.FrostRejoinPlugin
api-version: '1.21'
description: Holding-server plugin that auto-transfers players back after main restart
authors:
  - FrostSMP

commands:
  frostrejoin:
    description: Manage auto-rejoin to the main server
    usage: /frostrejoin <now|status|reload>
    aliases: [rejoin]

permissions:
  frostsmp.rejoin.admin:
    description: Force rejoin and reload FrostRejoin
    default: op
