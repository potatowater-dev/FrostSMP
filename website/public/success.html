<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Payment successful — Frost FFA</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="result-page">
    <div class="result-card reveal is-visible">
      <p class="result-eyebrow">Payment successful</p>
      <h1>Thank you!</h1>
      <p class="result-body">
        Your rank purchase went through. Staff will apply it to your Minecraft account —
        usually within a few minutes. If it’s not there after 30 minutes, open a ticket in
        <a href="https://discord.gg/playfrost" target="_blank" rel="noopener noreferrer">Discord</a>
        with your username and receipt email.
      </p>
      <div class="result-actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-discord" href="https://discord.gg/playfrost" target="_blank" rel="noopener noreferrer">Join Discord</a>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
